<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a, #111827);
      color: white;
      min-height: 100vh;
      transition: background 0.3s ease;
    }

    body.light-mode {
      background: linear-gradient(135deg, #f3f4f6, #e5e7eb);
      color: #1f2937;
    }

    .hidden {
      display: none !important;
    }

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.05);
      border: 2px solid rgba(16,185,129,0.4);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }

    body.light-mode .auth-box {
      background: rgba(255,255,255,0.9);
      border-color: rgba(16,185,129,0.6);
    }

    .auth-box h1 {
      text-align: center;
      margin-bottom: 28px;
      color: #34d399;
      font-size: 2.2rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-weight: 600;
      font-size: 0.95rem;
    }

    body.light-mode label {
      color: #4b5563;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(52,211,153,0.5);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    body.light-mode input {
      background: rgba(255,255,255,0.7);
      color: #1f2937;
      border-color: rgba(52,211,153,0.7);
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      outline: none;
      border-color: #34d399;
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.1);
    }

    body.light-mode input:focus {
      background: rgba(255,255,255,0.85);
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(16,185,129,0.4);
    }

    .toggle-auth {
      margin-top: 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    body.light-mode .toggle-auth {
      color: #6b7280;
    }

    .toggle-auth button {
      background: none;
      border: none;
      color: #34d399;
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
      margin-left: 4px;
    }

    .error-box, .success-box {
      display: none;
      padding: 12px 16px;
      margin-bottom: 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-box {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.5);
      color: #fca5a5;
    }

    .success-box {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.5);
      color: #bbf7d0;
    }

    .show {
      display: block !important;
    }

    .chat-screen {
      display: none;
      height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: rgba(16,185,129,0.08);
      border-bottom: 1px solid rgba(16,185,129,0.3);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    body.light-mode .chat-header {
      background: rgba(16,185,129,0.08);
      border-bottom-color: rgba(16,185,129,0.3);
    }

    .chat-header h1 {
      color: #34d399;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header-time {
      color: #9ca3af;
      font-size: 0.9rem;
      font-weight: 600;
    }

    body.light-mode .header-time {
      color: #6b7280;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .user-badge {
      background: rgba(139,92,246,0.2);
      color: #e9d5ff;
      border: 1px solid rgba(139,92,246,0.4);
      border-radius: 20px;
      padding: 6px 14px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    body.light-mode .user-badge {
      background: rgba(139,92,246,0.15);
      color: #7c3aed;
      border-color: rgba(139,92,246,0.5);
    }

    .icon-btn {
      background: none;
      border: none;
      color: #34d399;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(52,211,153,0.2);
    }

    .logout-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .logout-btn:hover {
      background: #b91c1c;
    }

    .chat-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,0.02);
      overflow: hidden;
    }

    .online-info {
      padding: 10px 20px;
      border-bottom: 1px solid rgba(16,185,129,0.2);
      color: #9ca3af;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    body.light-mode .online-info {
      color: #6b7280;
      background: rgba(16,185,129,0.05);
      border-bottom-color: rgba(16,185,129,0.2);
    }

    .online-info:hover {
      background: rgba(16,185,129,0.1);
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages-container::-webkit-scrollbar {
      width: 8px;
    }

    .messages-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages-container::-webkit-scrollbar-thumb {
      background: rgba(16,185,129,0.3);
      border-radius: 4px;
    }

    .messages-container::-webkit-scrollbar-thumb:hover {
      background: rgba(16,185,129,0.5);
    }

    .message-group {
      display: flex;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-group.sent {
      justify-content: flex-end;
    }

    .message-bubble {
      max-width: 60%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(16,185,129,0.2);
      border-radius: 18px;
      padding: 10px 14px;
      word-wrap: break-word;
      line-height: 1.4;
    }

    body.light-mode .message-bubble {
      background: rgba(16,185,129,0.08);
      border-color: rgba(16,185,129,0.3);
      color: #1f2937;
    }

    .message-group.sent .message-bubble {
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      color: white;
      border-radius: 18px;
    }

    .message-info {
      font-size: 0.75rem;
      opacity: 0.7;
      margin-bottom: 4px;
      color: #9ca3af;
    }

    body.light-mode .message-info {
      color: #6b7280;
    }

    .message-text {
      word-break: break-word;
    }

    .message-image {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      margin-top: 8px;
      cursor: pointer;
      object-fit: cover;
    }

    .message-video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 12px;
      margin-top: 8px;
    }

    .message-file {
      background: rgba(139,92,246,0.2);
      border: 1px solid rgba(139,92,246,0.4);
      padding: 10px 14px;
      border-radius: 12px;
      margin-top: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-block;
      transition: all 0.2s ease;
    }

    .message-file:hover {
      background: rgba(139,92,246,0.3);
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
      font-size: 1.1rem;
    }

    .input-section {
      padding: 16px 20px;
      border-top: 1px solid rgba(16,185,129,0.2);
      background: rgba(255,255,255,0.01);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-field {
      flex: 1;
    }

    .input-field input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 24px;
      border: 1px solid rgba(16,185,129,0.4);
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    body.light-mode .input-field input {
      background: rgba(255,255,255,0.7);
      color: #1f2937;
      border-color: rgba(16,185,129,0.5);
    }

    .input-field input::placeholder {
      color: #6b7280;
    }

    .input-field input:focus {
      outline: none;
      border-color: #34d399;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(52,211,153,0.1);
    }

    body.light-mode .input-field input:focus {
      background: rgba(255,255,255,0.85);
    }

    .file-input {
      display: none;
    }

    .action-btn {
      background: #34d399;
      border: none;
      color: #0f172a;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      background: #10b981;
      transform: scale(1.05);
    }

    .attach-btn {
      background: none;
      border: none;
      color: #34d399;
      cursor: pointer;
      font-size: 1.3rem;
      padding: 8px;
      transition: all 0.2s ease;
    }

    .attach-btn:hover {
      transform: scale(1.1);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: rgba(15,23,42,0.98);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 16px;
      padding: 24px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    body.light-mode .modal-content {
      background: rgba(255,255,255,0.95);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      color: #34d399;
      font-size: 1.3rem;
    }

    .close-modal {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.8rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .close-modal:hover {
      color: #34d399;
    }

    .settings-section {
      margin-top: 20px;
    }

    .settings-section:first-child {
      margin-top: 0;
    }

    .settings-section h3 {
      color: #34d399;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      margin-bottom: 8px;
    }

    body.light-mode .setting-row {
      background: rgba(16,185,129,0.05);
    }

    .setting-row label {
      margin: 0;
      font-weight: 600;
      flex: 1;
    }

    .toggle-switch {
      position: relative;
      width: 48px;
      height: 26px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(16,185,129,0.3);
      border-radius: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-switch.active {
      background: rgba(16,185,129,0.4);
      border-color: rgba(16,185,129,0.6);
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: left 0.2s ease;
    }

    .toggle-switch.active::after {
      left: 24px;
    }

    .online-users-list {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .user-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(16,185,129,0.1);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-item:last-child {
      border-bottom: none;
    }

    body.light-mode .user-item {
      border-bottom-color: rgba(16,185,129,0.15);
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
    }

    .user-item .username {
      flex: 1;
      font-weight: 600;
    }

    .user-item .badge {
      background: rgba(139,92,246,0.2);
      color: #e9d5ff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    .image-viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 101;
      cursor: pointer;
    }

    .image-viewer.show {
      display: flex;
    }

    .image-viewer img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .message-bubble {
        max-width: 85%;
      }
      .chat-screen {
        padding: 0;
      }
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h1>Chat</h1>

      <div id="authError" class="error-box"></div>
      <div id="authSuccess" class="success-box"></div>

      <div id="signupForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="signupUsername" placeholder="Choose a username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="signupPassword" placeholder="Create a password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="signupConfirm" placeholder="Confirm password" />
        </div>
        <button class="btn" onclick="signup()">Sign Up</button>
        <div class="toggle-auth">
          Already have an account?
          <button onclick="toggleForm('login')">Log In</button>
        </div>
      </div>

      <div id="loginForm" class="hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" />
        </div>
        <button class="btn" onclick="login()">Log In</button>
        <div class="toggle-auth">
          Need an account?
          <button onclick="toggleForm('signup')">Sign Up</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Chat Screen -->
  <div class="chat-screen" id="chatScreen">
    <div class="chat-header">
      <h1>💬 Chat</h1>
      <div class="header-time" id="timeDisplay">12:00:00 AM</div>
      <div class="header-actions">
        <span class="user-badge" id="userBadge">Guest</span>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle theme">
          <span id="themeIcon">🌙</span>
        </button>
        <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
        <button class="logout-btn" onclick="logout()">Log Out</button>
      </div>
    </div>

    <div class="chat-body">
      <div class="online-info" onclick="openOnlineUsers()">
        👥 <span id="onlineCount">0</span> online • Click to view
      </div>

      <div class="messages-container" id="messagesContainer">
        <div class="empty-state">Start a conversation</div>
      </div>
    </div>

    <div class="input-section">
      <div class="input-row">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">📎</button>
        <div class="input-field">
          <input type="text" id="messageInput" placeholder="Type a message..." />
          <input type="file" id="fileInput" class="file-input" />
        </div>
        <button class="action-btn" onclick="sendMessage()" title="Send">➤</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>⚙️ Settings</h2>
        <button class="close-modal" onclick="closeSettings()">✕</button>
      </div>

      <div id="settingsError" class="error-box"></div>
      <div id="settingsSuccess" class="success-box"></div>

      <!-- Account Settings -->
      <div class="settings-section">
        <h3>Account</h3>
        <div class="form-group">
          <label>Change Username</label>
          <input type="password" id="passForUsername" placeholder="Current password" />
          <input type="text" id="newUsername" placeholder="New username" style="margin-top: 8px;" />
          <button class="btn" onclick="changeUsername()" style="margin-top: 8px;">Update</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="form-group">
          <label>Change Password</label>
          <input type="password" id="oldPass" placeholder="Current password" />
          <input type="password" id="newPass" placeholder="New password" style="margin-top: 8px;" />
          <input type="password" id="confirmPass" placeholder="Confirm password" style="margin-top: 8px;" />
          <button class="btn" onclick="changePassword()" style="margin-top: 8px;">Update</button>
        </div>
      </div>

      <!-- Display Settings -->
      <div class="settings-section">
        <h3>Display</h3>
        <div class="setting-row">
          <label>Timestamps</label>
          <div class="toggle-switch active" onclick="toggleTimestamps()"></div>
        </div>
        <div class="setting-row">
          <label>Sound Notifications</label>
          <div class="toggle-switch active" onclick="toggleNotifications()"></div>
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="settings-section">
        <h3>Danger</h3>
        <button class="btn" style="background: #dc2626; margin-top: 8px;" onclick="deleteAccount()">Delete Account</button>
      </div>
    </div>
  </div>

  <!-- Online Users Modal -->
  <div class="modal" id="onlineUsersModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>👥 Online Users</h2>
        <button class="close-modal" onclick="closeOnlineUsers()">✕</button>
      </div>
      <div class="online-users-list" id="onlineUsersList"></div>
    </div>
  </div>

  <!-- Image Viewer -->
  <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
    <img id="viewerImg" />
  </div>

  <script>
    const USERS_KEY = "chat_users";
    const CURRENT_USER_KEY = "chat_current_user";
    const MESSAGES_KEY = "chat_messages";
    const SETTINGS_KEY = "chat_settings";
    const THEME_KEY = "chat_theme";

    let users = JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
    let currentUser = localStorage.getItem(CURRENT_USER_KEY);
    let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{"showTimestamps": true, "soundNotifications": true}');
    let isDarkMode = localStorage.getItem(THEME_KEY) !== "light";

    function saveUsers() {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function getMessages() {
      return JSON.parse(localStorage.getItem(MESSAGES_KEY) || "[]");
    }

    function saveMessages(msgs) {
      localStorage.setItem(MESSAGES_KEY, JSON.stringify(msgs));
    }

    function saveSettings() {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
    }

    function updateTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      document.getElementById("timeDisplay").textContent = `${h}:${m}:${s} ${ampm}`;
    }

    setInterval(updateTime, 1000);
    updateTime();

    function toggleTheme() {
      isDarkMode = !isDarkMode;
      localStorage.setItem(THEME_KEY, isDarkMode ? "dark" : "light");
      document.body.classList.toggle("light-mode", !isDarkMode);
      document.getElementById("themeIcon").textContent = isDarkMode ? "🌙" : "☀️";
    }

    function applyTheme() {
      if (!isDarkMode) {
        document.body.classList.add("light-mode");
        document.getElementById("themeIcon").textContent = "☀️";
      } else {
        document.getElementById("themeIcon").textContent = "🌙";
      }
    }

    function showError(msg) {
      const box = document.getElementById("authError");
      box.textContent = msg;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 4000);
    }

    function showSettingsError(msg) {
      const box = document.getElementById("settingsError");
      box.textContent = msg;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 4000);
    }

    function showSettingsSuccess(msg) {
      const box = document.getElementById("settingsSuccess");
      box.textContent = msg;
      box.classList.add("show");
      setTimeout(() => box.classList.remove("show"), 3000);
    }

    function toggleForm(form) {
      document.getElementById("signupForm").classList.toggle("hidden", form !== "signup");
      document.getElementById("loginForm").classList.toggle("hidden", form !== "login");
      document.getElementById("authError").classList.remove("show");
    }

    function signup() {
      const username = document.getElementById("signupUsername").value.trim();
      const password = document.getElementById("signupPassword").value;
      const confirm = document.getElementById("signupConfirm").value;

      if (!username || !password || !confirm) {
        showError("All fields required");
        return;
      }

      if (password.length < 4) {
        showError("Password must be 4+ characters");
        return;
      }

      if (password !== confirm) {
        showError("Passwords don't match");
        return;
      }

      if (users[username]) {
        showError("Username exists");
        return;
      }

      users[username] = password;
      saveUsers();
      currentUser = username;
      localStorage.setItem(CURRENT_USER_KEY, currentUser);
      showChat();
    }

    function login() {
      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!username || !password) {
        showError("Username and password required");
        return;
      }

      if (!users[username] || users[username] !== password) {
        showError("Invalid credentials");
        return;
      }

      currentUser = username;
      localStorage.setItem(CURRENT_USER_KEY, currentUser);
      showChat();
    }

    function logout() {
      if (!confirm("Log out?")) return;
      currentUser = null;
      localStorage.removeItem(CURRENT_USER_KEY);
      document.getElementById("authScreen").style.display = "flex";
      document.getElementById("chatScreen").style.display = "none";
      document.getElementById("signupForm").classList.remove("hidden");
      document.getElementById("loginForm").classList.add("hidden");
    }

    function showChat() {
      document.getElementById("authScreen").style.display = "none";
      document.getElementById("chatScreen").style.display = "flex";
      document.getElementById("userBadge").textContent = currentUser;
      renderMessages();
      updateOnlineCount();
    }

    function renderMessages() {
      const msgs = getMessages();
      const container = document.getElementById("messagesContainer");

      if (!msgs.length) {
        container.innerHTML = '<div class="empty-state">Start a conversation</div>';
        return;
      }

      container.innerHTML = msgs.map(msg => {
        const isOwn = msg.user === currentUser;
        const time = settings.showTimestamps ? formatTime(msg.time) : "";

        let content = `<div class="message-info">${msg.user}${time ? " • " + time : ""}</div>
                       <div class="message-text">${msg.text}</div>`;

        if (msg.type === "image") {
          content += `<img src="${msg.content}" class="message-image" onclick="viewImage('${msg.content.replace(/'/g, "\\'")}')">`;
        } else if (msg.type === "video") {
          content += `<video controls class="message-video"><source src="${msg.content}"></video>`;
        } else if (msg.type === "file") {
          content += `<a href="${msg.content}" download="${msg.fileName}" class="message-file">📁 ${msg.fileName}</a>`;
        }

        return `<div class="message-group ${isOwn ? "sent" : ""}">
                  <div class="message-bubble">${content}</div>
                </div>`;
      }).join("");

      container.scrollTop = container.scrollHeight;
    }

    function formatTime(iso) {
      const d = new Date(iso);
      let h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, "0");
      const s = String(d.getSeconds()).padStart(2, "0");
      const ampm = h >= 12 ? "PM" : "AM";
      h = h % 12 || 12;
      return `${h}:${m}:${s} ${ampm}`;
    }

    function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = input.value.trim();

      if (!text) return;

      const msgs = getMessages();
      msgs.push({
        user: currentUser,
        text,
        type: "text",
        time: new Date().toISOString()
      });

      saveMessages(msgs);
      renderMessages();
      input.value = "";

      if (settings.soundNotifications) playSound();
    }

    document.getElementById("fileInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const msgs = getMessages();
        let type = "file";

        if (file.type.startsWith("image/")) type = "image";
        else if (file.type.startsWith("video/")) type = "video";

        msgs.push({
          user: currentUser,
          text: `Shared a ${type}`,
          type,
          content: event.target.result,
          fileName: file.name,
          time: new Date().toISOString()
        });

        saveMessages(msgs);
        renderMessages();
        document.getElementById("fileInput").value = "";

        if (settings.soundNotifications) playSound();
      };

      reader.readAsDataURL(file);
    });

    function viewImage(src) {
      document.getElementById("viewerImg").src = src;
      document.getElementById("imageViewer").classList.add("show");
    }

    function closeImageViewer() {
      document.getElementById("imageViewer").classList.remove("show");
    }

    function playSound() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 800;
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.1);
    }

    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    function updateOnlineCount() {
      const count = Object.keys(users).length;
      document.getElementById("onlineCount").textContent = count;
    }

    function openOnlineUsers() {
      const list = document.getElementById("onlineUsersList");
      const names = Object.keys(users);

      if (!names.length) {
        list.innerHTML = "<div class='user-item'>No users online</div>";
      } else {
        list.innerHTML = names.map(name => `
          <div class="user-item">
            <div class="online-dot"></div>
            <span class="username">${name}</span>
            ${name === currentUser ? '<span class="badge">You</span>' : ""}
          </div>
        `).join("");
      }

      document.getElementById("onlineUsersModal").classList.add("show");
    }

    function closeOnlineUsers() {
      document.getElementById("onlineUsersModal").classList.remove("show");
    }

    function openSettings() {
      document.getElementById("settingsModal").classList.add("show");
    }

    function closeSettings() {
      document.getElementById("settingsModal").classList.remove("show");
    }

    function changeUsername() {
      const pass = document.getElementById("passForUsername").value;
      const newUname = document.getElementById("newUsername").value.trim();

      if (!pass || !newUname) {
        showSettingsError("Fill all fields");
        return;
      }

      if (users[currentUser] !== pass) {
        showSettingsError("Wrong password");
        return;
      }

      if (users[newUname]) {
        showSettingsError("Username taken");
        return;
      }

      users[newUname] = users[currentUser];
      delete users[currentUser];
      saveUsers();

      const msgs = getMessages();
      msgs.forEach(m => {
        if (m.user === currentUser) m.user = newUname;
      });
      saveMessages(msgs);

      currentUser = newUname;
      localStorage.setItem(CURRENT_USER_KEY, currentUser);
      document.getElementById("userBadge").textContent = currentUser;

      showSettingsSuccess("Username updated!");
      document.getElementById("passForUsername").value = "";
      document.getElementById("newUsername").value = "";
      renderMessages();
      updateOnlineCount();
    }

    function changePassword() {
      const old = document.getElementById("oldPass").value;
      const newp = document.getElementById("newPass").value;
      const conf = document.getElementById("confirmPass").value;

      if (!old || !newp || !conf) {
        showSettingsError("Fill all fields");
        return;
      }

      if (users[currentUser] !== old) {
        showSettingsError("Wrong password");
        return;
      }

      if (newp.length < 4) {
        showSettingsError("Password 4+ characters");
        return;
      }

      if (newp !== conf) {
        showSettingsError("Passwords don't match");
        return;
      }

      users[currentUser] = newp;
      saveUsers();
      showSettingsSuccess("Password updated!");
      document.getElementById("oldPass").value = "";
      document.getElementById("newPass").value = "";
      document.getElementById("confirmPass").value = "";
    }

    function toggleTimestamps() {
      settings.showTimestamps = !settings.showTimestamps;
      saveSettings();
      renderMessages();
      document.querySelector('[onclick="toggleTimestamps()"]').classList.toggle("active");
    }

    function toggleNotifications() {
      settings.soundNotifications = !settings.soundNotifications;
      saveSettings();
      document.querySelector('[onclick="toggleNotifications()"]').classList.toggle("active");
    }

    function deleteAccount() {
      if (!confirm(`Delete account "${currentUser}"? This cannot be undone.`)) return;

      delete users[currentUser];
      saveUsers();

      const msgs = getMessages();
      saveMessages(msgs.filter(m => m.user !== currentUser));

      currentUser = null;
      localStorage.removeItem(CURRENT_USER_KEY);
      closeSettings();
      logout();
    }

    applyTheme();

    if (currentUser && users[currentUser]) {
      showChat();
    } else {
      document.getElementById("authScreen").style.display = "flex";
      document.getElementById("chatScreen").style.display = "none";
    }
  </script>
</body>
</html>
